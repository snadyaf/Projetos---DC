<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards de Compras</title>
</head>
<body>
    <div class="container">
       <div class="card">
            <img src="notebook.png" alt="notebook-card">
            <h1>Notebook Inspiron 15</h1><br>
            <p>⭐⭐⭐⭐⭐ (520)</p><br>
            <h3>R$ 3.199,00</h3><br>
            <button>Adicionar ao carrinho</button>
        </div>
        <div class="card">
            <img src="impressora.png" alt="impressora-card">
            <h1>Impressora Epson EcoTank</h1><br>
            <p>⭐⭐⭐⭐⭐ (228)</p><br>
            <h3>R$ 899,00</h3><br>
            <button>Adicionar ao carrinho</button>
        </div>
        <div class="card">
            <img src="computador.png" alt="computador-card">
            <h1>Computador Dell All-in-one</h1><br>
            <p>⭐⭐⭐⭐⭐ (210)</p><br>
            <h3>R$ 8.599,00</h3><br>
            <button>Adicionar ao carrinho</button>
        </div>
    </div>
</body>
</html>
